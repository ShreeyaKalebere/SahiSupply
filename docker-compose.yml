# Local stack: MongoDB + SahiSupply (API serving the built UI on http://localhost:8000).
# First run:  docker compose up -d --build && docker compose run --rm seed
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  app:
    build: .
    environment:
      APP_ENV: production
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: sahisupply
      CORS_ORIGINS: http://localhost:8000
    ports: ["8000:8000"]
    depends_on:
      mongo: { condition: service_healthy }

  seed:
    build: .
    profiles: ["tools"]
    command: ["python", "backend/scripts/seed_database.py"]
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: sahisupply
    depends_on:
      mongo: { condition: service_healthy }

volumes:
  mongo-data:
