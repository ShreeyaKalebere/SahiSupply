industry: grocery
company: Nestle
company_name: Nestlé India
color: "#10b981"
display_name: Nestlé India (Grocery)
description: Order rationing for quick-commerce dark stores, hubs, and supermarkets across India.
destination_types: ["10-Min Dark Store", "Quick-Commerce Dark Store", "Quick-Commerce Hub", "Modern Trade Supermarket", "Premium Gourmet Grocery", "supermarket", "kirana"]
planning:
  review_period_days: 7
  need_source: orders
service_levels:
  critical: 1.28
  standard: 1.28   # 90%
kpis: [fill_rate, expiry_risk_units, cost_per_delivered_unit]
rules:
  - id: G1
    template: min_life_on_arrival
    params: { min_days: 3 }
    status: active
    description: Block a batch if fewer than 3 days of shelf life remain on arrival.
  - id: G1-FEFO
    template: fefo
    params: { enabled: true }
    status: active
    description: Prefer earlier-expiring eligible batches as a bounded tie-break (never outweighs >1% of the smallest unit cost).
